<text class="l l4" x="16" y="128" xml:space="preserve"><tspan class="">tools:  codex_plan, codex_image, codex_result, codex_resume, codex_cancel</tspan></text>
<text class="l l5" x="16" y="147" xml:space="preserve"><tspan class=""># Claude asks Codex for a plan (read-only sandbox, effort low):</tspan></text>
<text class="l l6" x="16" y="166" xml:space="preserve"><tspan class="cy">codex_plan</tspan><tspan class=""> request="app.js add() returns a - b. Plan a fix plus a test, under 8 lines."</tspan></text>
<text class="l l7" x="16" y="185" xml:space="preserve"><tspan class="dim">  ... codex: I’ll inspect `app.js` and the test setup.</tspan></text>
<text class="l l8" x="16" y="204" xml:space="preserve"><tspan class="dim">  ... codex: running "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe" -Command "rg </tspan></text>
<text class="l l9" x="16" y="223" xml:space="preserve"><tspan class="dim">--files -g '"'!node_modules'"' -g '"'!pack</tspan></text>
<text class="l l10" x="16" y="242" xml:space="preserve"><tspan class="dim">  ... codex: command_execution</tspan></text>
<text class="l l11" x="16" y="261" xml:space="preserve"><tspan class="dim">  ... codex: running "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe" -Command </tspan></text>
<text class="l l12" x="16" y="280" xml:space="preserve"><tspan class="dim">'Get-Content app.js; Get-ChildItem -Force -Nam</tspan></text>
<text class="l l13" x="16" y="299" xml:space="preserve"><tspan class="dim">  ... codex: command_execution</tspan></text>
<text class="l l14" x="16" y="318" xml:space="preserve"><tspan class="dim">  ... codex: Goal/acceptance: `app.js`’s exported `add(a, b)` returns the sum; a regression test </tspan></text>
<text class="l l15" x="16" y="337" xml:space="preserve"><tspan class="dim">passes.
1. In `app.js`, change `add()` from `return a - b;` to `return a + b</tspan></text>
<text class="l l16" x="16" y="356" xml:space="preserve"><tspan class="gr">done in 19s</tspan><tspan class="">  isError=false</tspan></text>
<text class="l l17" x="16" y="375" xml:space="preserve"><tspan class="">Goal/acceptance: `app.js`’s exported `add(a, b)` returns the sum; a regression test passes.</tspan></text>
<text class="l l18" x="16" y="394" xml:space="preserve"><tspan class="">1. In `app.js`, change `add()` from `return a - b;` to `return a + b;`, preserving the CommonJS </tspan></text>
<text class="l l19" x="16" y="413" xml:space="preserve"><tspan class="">export.</tspan></text>
<text class="l l20" x="16" y="432" xml:space="preserve"><tspan class="">2. Create `app.test.js` using `node:test` and `node:assert/strict`; import `add` via </tspan></text>
<text class="l l21" x="16" y="451" xml:space="preserve"><tspan class="">`require('./app')` and assert `add(2, 3) === 5`.</tspan></text>
<text class="l l22" x="16" y="470" xml:space="preserve"><tspan class="">3. Verify with `node --test app.test.js`; confirm the test fails against the original subtraction.</tspan></text>
<text class="l l23" x="16" y="489" xml:space="preserve"><tspan class="">Risk/open question: No package manifest or test setup exists; confirm Node supports `node:test`.</tspan></text>
