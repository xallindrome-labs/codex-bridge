<text x="427.6" y="22" text-anchor="middle" class="dim" style="font-size:12px">codex-bridge (real run, idle time trimmed)</text>
<text class="l l0" x="16" y="52" xml:space="preserve"><tspan class="">$ claude mcp add codex-bridge -- npx -y codex-bridge</tspan></text>
<text class="l l1" x="16" y="71" xml:space="preserve"><tspan class="">Added stdio MCP server codex-bridge</tspan></text>
<text class="l l2" x="16" y="90" xml:space="preserve"><tspan class=""># Claude Code starts the server and asks what it offers:</tspan></text>
<text class="l l3" x="16" y="109" xml:space="preserve"><tspan class="">server: codex-bridge 0.1.0</tspan></text>
<text class="l l4" x="16" y="128" xml:space="preserve"><tspan class="">tools:  codex_plan, codex_image, codex_result, codex_resume, codex_cancel</tspan></text>
<text class="l l5" x="16" y="147" xml:space="preserve"><tspan class=""># Claude asks Codex for a plan (read-only sandbox, effort low):</tspan></text>
<text class="l l6" x="16" y="166" xml:space="preserve"><tspan class="cy">codex_plan</tspan><tspan class=""> request="app.js add() returns a - b. Plan a fix plus a test, under 8 lines."</tspan></text>
<text class="l l7" x="16" y="185" xml:space="preserve"><tspan class="dim">  ... codex: I’ll inspect `app.js` and the test setup to ground the plan.</tspan></text>
<text class="l l8" x="16" y="204" xml:space="preserve"><tspan class="dim">  ... codex: running "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe" -Command </tspan></text>
<text class="l l9" x="16" y="223" xml:space="preserve"><tspan class="dim">"Get-Location; rg --files -g '"'!node_modules'</tspan></text>
<text class="l l10" x="16" y="242" xml:space="preserve"><tspan class="dim">  ... codex: command_execution</tspan></text>
<text class="l l11" x="16" y="261" xml:space="preserve"><tspan class="dim">  ... codex: running "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe" -Command </tspan></text>
<text class="l l12" x="16" y="280" xml:space="preserve"><tspan class="dim">'Get-Content app.js; Get-ChildItem -Force -Nam</tspan></text>
<text class="l l13" x="16" y="299" xml:space="preserve"><tspan class="dim">  ... codex: command_execution</tspan></text>
<text class="l l14" x="16" y="318" xml:space="preserve"><tspan class="dim">  ... codex: Goal: `add(a, b)` returns the sum; acceptance: a regression test passes.
1. In </tspan></text>
<text class="l l15" x="16" y="337" xml:space="preserve"><tspan class="dim">`app.js`, change `add()` from `return a - b;` to `return a + b;`, preserving `mod</tspan></text>
<text class="l l16" x="16" y="356" xml:space="preserve"><tspan class="gr">done in 25s</tspan><tspan class="">  isError=false</tspan></text>
<text class="l l17" x="16" y="375" xml:space="preserve"><tspan class="">Goal: `add(a, b)` returns the sum; acceptance: a regression test passes.</tspan></text>
<text class="l l18" x="16" y="394" xml:space="preserve"><tspan class="">1. In `app.js`, change `add()` from `return a - b;` to `return a + b;`, preserving `module.exports </tspan></text>
<text class="l l19" x="16" y="413" xml:space="preserve"><tspan class="">= { add }`.</tspan></text>
<text class="l l20" x="16" y="432" xml:space="preserve"><tspan class="">2. Create `app.test.js` using `node:test` and `node:assert/strict`; require `./app` and assert </tspan></text>
<text class="l l21" x="16" y="451" xml:space="preserve"><tspan class="">`add(2, 3) === 5`.</tspan></text>
<text class="l l22" x="16" y="470" xml:space="preserve"><tspan class="">3. Verify the test fails before the fix (actual `-1`), then passes afterward: `node --test </tspan></text>
<text class="l l23" x="16" y="489" xml:space="preserve"><tspan class="">app.test.js`.</tspan></text>
<text class="l l24" x="16" y="508" xml:space="preserve"><tspan class="">Risk/open question: only `app.js` exists; no test setup or Node version is declared. Confirm Node </tspan></text>
<text class="l l25" x="16" y="527" xml:space="preserve"><tspan class="">supports `node:test`.</tspan></text>
