name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No Codex CLI or login is available in CI, so these test the server itself:
      # the MCP handshake, tool list and input validation, then (on Linux and macOS)
      # the job lifecycle against a fake `codex` executable.
      - name: Protocol test
        shell: bash
        run: node test/protocol.mjs

      - name: Job lifecycle test (fake codex; skipped on Windows)
        shell: bash
        run: node test/jobs.mjs

      # Install the packed tarball into an empty folder and run the same tests against
      # the installed copy, so a file missing from the package fails CI.
      - name: Pack, install and test the installed package
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/xallindrome-labs-codex-bridge-*.tgz
          for f in server.mjs runner.mjs lib.mjs LICENSE README.md; do
            test -f "node_modules/@xallindrome-labs/codex-bridge/$f" || { echo "missing from package: $f"; exit 1; }
          done
          cd "$GITHUB_WORKSPACE"
          export CODEX_BRIDGE_TEST_SERVER="$RUNNER_TEMP/clean/node_modules/@xallindrome-labs/codex-bridge/server.mjs"
          node test/protocol.mjs
          node test/jobs.mjs
